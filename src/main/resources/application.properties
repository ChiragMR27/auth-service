# Server Configuration (Render assigns PORT dynamically; defaults to 8081 locally)
server.port=${PORT:8081}

# Database Configuration (Aiven MySQL - auth_db)
spring.datasource.url=jdbc:mysql://lifesync-cloud-db-chiragmr676-e1dc.h.aivencloud.com:19529/auth_db?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Token Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000